<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f2f7;
  --muted: #7b8399;
  --muted2: #4a5168;
  --s1: #3b82f6; --s1bg: rgba(59,130,246,0.12);
  --s2: #10b981; --s2bg: rgba(16,185,129,0.12);
  --s3: #f59e0b; --s3bg: rgba(245,158,11,0.12);
  --s4: #a78bfa; --s4bg: rgba(167,139,250,0.12);
  --apt: #f87171; --aptbg: rgba(248,113,113,0.12);
  --accent: #3b82f6;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #f87171;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 14px; overflow-x: hidden; }
body { padding-bottom: 72px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Layout Elements */
.top-header { padding: 16px 16px 12px; background: var(--bg); position: sticky; top: 0; z-index: 20; border-bottom: 0.5px solid var(--border); }
.exam-banner { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.exam-left { display: flex; align-items: baseline; gap: 6px; }
.exam-days { font-size: 32px; font-weight: 600; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
.exam-label { font-size: 12px; color: var(--muted); }
.exam-right { text-align: right; }
.exam-date { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.syl-pill { background: var(--s3bg); color: var(--amber); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; display: inline-block; }

.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 0.5px solid var(--border2); display: flex; z-index: 30; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 4px 8px; cursor: pointer; gap: 3px; opacity: 0.5; transition: opacity 0.15s; }
.nav-item.active { opacity: 1; }
.nav-icon { font-size: 20px; }
.nav-label { font-size: 10px; font-weight: 500; color: var(--text); }
.nav-item.active .nav-label, .nav-item.active .nav-icon { color: var(--accent); }

.section { display: none; padding: 12px 14px; }
.section.active { display: block; }
.sec-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 18px 0 8px; }
.sec-label:first-child { margin-top: 4px; }

.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.bar-bg { height: 5px; background: var(--border2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

/* Stream Cards */
.stream-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid; }
.stream-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.stream-name { font-size: 15px; font-weight: 600; color: var(--text); }
.stream-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

/* Checklists */
.check-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); cursor: pointer; user-select: none; }
.check-item:last-child { border-bottom: none; padding-bottom: 0; }
.chkbox { width: 22px; height: 22px; border: 1.5px solid var(--border2); border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
.chkbox.on { background: var(--accent); border-color: var(--accent); }
.chk-label { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
.chk-label.struck { color: var(--muted); text-decoration: line-through; }

/* Timeline */
.tl-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.tl-item:last-child { border-bottom: none; }
.tl-dot-col { display: flex; flex-direction: column; align-items: center; gap: 0; padding-top: 4px; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.tl-line { width: 1px; flex: 1; background: var(--border); min-height: 20px; margin-top: 4px; }
.tl-body { flex: 1; }
.tl-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.tl-dates { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.tl-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.tl-rem { font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.3px; }
.b-active { background: rgba(59,130,246,0.15); color: #93c5fd; }
.b-done { background: rgba(16,185,129,0.15); color: #6ee7b7; }
.b-soon { background: var(--border); color: var(--muted); }
.b-post { background: rgba(245,158,11,0.15); color: #fcd34d; }

/* Tests */
.test-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; }
.test-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.test-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
.test-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.month-header { background: var(--surface2); border-radius: var(--radius-sm); padding: 7px 12px; margin-bottom: 8px; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.score-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.score-input { width: 70px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: 'JetBrains Mono', monospace; padding: 6px; text-align: center; outline: none; }
.score-input:focus { border-color: var(--accent); }
.bmark-area { width: 100%; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 12px; padding: 8px 10px; resize: none; min-height: 52px; outline: none; margin-top: 4px; }

/* Post-Jul */
.phase-banner { background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(248,113,113,0.1)); border: 0.5px solid rgba(245,158,11,0.3); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.phase-title { font-size: 14px; font-weight: 600; color: var(--amber); }
.phase-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.ps-note { width: 100%; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 12px; padding: 8px 10px; resize: none; min-height: 60px; outline: none; margin-top: 8px; }

.apt-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.apt-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--aptbg); display: flex; align-items: center; justify-content: center; font-size: 18px; }
</style>
</head>

TESTS.sort((a,b)=>a.date-b.date);

function status(s){
  if(TODAY < s.start) return 'soon';
  if(TODAY >= s.end) return 'done';
  return 'active';
}
function dayNum(s){return Math.max(1, diff(s.start,TODAY)+1);}
function pct(s){
  if(status(s)==='done') return 100;
  if(status(s)==='soon') return 0;
  return Math.min(99, Math.round(dayNum(s)/s.days*100));
}

function renderTop(){
  document.getElementById('examDays').textContent = Math.max(0, diff(TODAY,EXAM));
  document.getElementById('todayStr').textContent = TODAY.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const sylD = Math.max(0, diff(TODAY,SYL));
  document.getElementById('sylPill').textContent = sylD > 0 ? `${sylD} days to Jul 31` : 'Syllabus Phase Over';
}

function renderToday(){
  const active = SUBJ.filter(s => s.days !== 999 && status(s) === 'active');
  const streamsDiv = document.getElementById('activeStreams');
  
  if(!active.length){
    streamsDiv.innerHTML = '<div style="color:var(--muted); text-align:center; padding: 10px;">No parallel subjects active currently.</div>';
  } else {
    streamsDiv.innerHTML = active.map(s => {
      const p = pct(s);
      return `<div class="stream-card" style="border-left-color:${s.hex}">
        <div class="stream-top">
          <div>
            <div style="font-size:10px;font-weight:600;letter-spacing:.5px;color:${s.hex};margin-bottom:3px">${SNAMES[s.stream]}</div>
            <div class="stream-name">${s.name}</div>
          </div>
          <div style="font-size:20px;font-weight:600;color:${s.hex};font-family:'JetBrains Mono',monospace">${p}%</div>
        </div>
        <div class="stream-meta">Day ${dayNum(s)} of ${s.days} &nbsp;·&nbsp; ${diff(TODAY, s.end)} days left</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${s.hex}"></div></div>
      </div>`;
    }).join('');
  }

  const dkey = 'chk_'+TODAY.toISOString().slice(0,10);
  if(!state[dkey]) state[dkey] = {};
  
  const tasks = active.map(s => `${s.name} Day ${dayNum(s)}`);
  
  document.getElementById('dailyList').innerHTML = tasks.length > 0 ? tasks.map((t,i) => {
    const k = 't'+i; const on = !!state[dkey][k];
    return `<div class="check-item" onclick="togDay('${dkey}','${k}',this)">
      <div class="chkbox ${on?'on':''}"><span style="color:#fff;font-size:14px">${on?'✓':''}</span></div>
      <span class="chk-label ${on?'struck':''}">${t}</span>
    </div>`;
  }).join('') : '<div style="color:var(--muted); font-size:12px;">No active stream tasks for today.</div>';
}

window.togDay = function(k,tid,row){
  state[k][tid] = !state[k][tid]; save();
  const on = state[k][tid];
  row.querySelector('.chkbox').className = 'chkbox'+(on?' on':'');
  row.querySelector('.chkbox span').textContent = on?'✓':'';
  row.querySelector('.chk-label').className = 'chk-label'+(on?' struck':'');
};

function renderTimeline(){
  document.getElementById('timelineList').innerHTML = SUBJ.map((s,i) => {
    const st = status(s);
    const rem = s.days === 999 ? diff(TODAY,EXAM) : Math.max(0, diff(TODAY,s.end));
    let badgeClass = 'b-soon', badgeT = 'Upcoming';
    if(st === 'active'){ badgeClass = 'b-active'; badgeT = 'Active'; }
    else if(st === 'done'){ badgeClass = 'b-done'; badgeT = 'Completed'; }
    
    return `<div class="tl-item">
      <div class="tl-dot-col">
        <div class="tl-dot" style="background:${s.hex}"></div>
        ${i < SUBJ.length-1 ? '<div class="tl-line"></div>' : ''}
      </div>
      <div class="tl-body">
        <div class="tl-name">${s.name}</div>
        <div class="tl-dates">${fmt(s.start)} → ${s.days===999?'7 Feb 2027':fmt(s.end)} &nbsp;·&nbsp; ${SNAMES[s.stream]}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct(s)}%;background:${s.hex}"></div></div>
        <div class="tl-footer">
          <span class="badge ${badgeClass}">${badgeT}</span>
          <span class="tl-rem" style="color:${s.hex}">${st==='done'?'Done':rem+'d left'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTests(){
  const testsDiv = document.getElementById('testsList');
  let html = '';
  
  // Group tests by month
  const byMonth={};
  TESTS.forEach(t=>{
    const mk=t.date.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if(!byMonth[mk])byMonth[mk]=[];
    byMonth[mk].push(t);
  });
  
  const subColor={dm:'#3b82f6',toc:'#10b981',dbms:'#f59e0b',em:'#a78bfa',cd:'#10b981',dl1:'#a78bfa',dl2:'#a78bfa',coa:'#f59e0b',os:'#10b981',cp:'#f59e0b',cn:'#3b82f6',algo:'#10b981',ds:'#f59e0b',mock:'#f87171'};

  Object.keys(byMonth).forEach(mk => {
    html += `<div class="month-header">${mk}</div>`;
    byMonth[mk].forEach(t => {
      const ts = state['ts_'+t.id] || {};
      const c = subColor[t.sub] || '#7b8399';
      
      const isPast = TODAY > t.date;
      const isDue = diff(TODAY,t.date) >= 0 && diff(TODAY,t.date) <= 3;
      const hasScore = ts.obt !== undefined && ts.obt !== '';
      
      let bc = 'b-soon', bt = 'Upcoming';
      if(hasScore) { bc = 'b-done'; bt = 'Done'; }
      else if(isDue) { bc = 'b-active'; bt = 'Due soon'; }
      else if(isPast) { bc = 'b-post'; bt = 'Pending'; }
      
      let feedBackHTML = '';
      if(hasScore && ts.tot) {
          const percentage = (Number(ts.obt) / Number(ts.tot)) * 100;
          feedBackHTML = `<span style="font-size:12px;font-weight:600;color:${percentage>=60?'var(--green)':'var(--red)'}">${percentage>=60?'✓ Good':'↑ Revise'}</span>`;
      }

      html += `<div class="test-card" style="border-left: 2px solid ${c}">
        <div class="test-header">
          <div class="test-name">${t.name}</div>
          <span class="badge ${bc}">${bt}</span>
        </div>
        <div class="test-meta">${fmtY(t.date)} &nbsp;·&nbsp; <span style="color:${c}">${t.sub==='mock'?'Mock Test':(SUBJ.find(s=>s.id===t.sub)||{name:t.sub}).name}</span></div>
        <div class="score-row">
          <span style="font-size: 12px; color: var(--muted);">Marks:</span>
          <input class="score-input" type="number" placeholder="Obt" value="${ts.obt||''}" oninput="savets('${t.id}','obt',this.value)">
          <span style="color: var(--muted); margin: 0 2px;">/</span>
          <input class="score-input" type="number" placeholder="Tot" value="${ts.tot||''}" oninput="savets('${t.id}','tot',this.value)">
          ${feedBackHTML}
        </div>
        <div style="font-size: 11px; color: var(--muted);">Bookmarks / Notes:</div>
        <textarea class="bmark-area" placeholder="e.g. Q12 logic, Q15 formula..." oninput="savets('${t.id}','bmark',this.value)">${ts.bmark||''}</textarea>
      </div>`;
    });
  });

  testsDiv.innerHTML = html;
}

window.savets = function(id,field,val){
  if(!state['ts_'+id]) state['ts_'+id] = {};
  state['ts_'+id][field] = val; save();
  
  if(field === 'obt' || field === 'tot') {
      renderTests();
      const inputs = document.querySelectorAll(`input[oninput*="'${id}','${field}'"]`);
      if(inputs.length > 0) inputs[0].focus();
  }
};

function renderPost(){
  const today = TODAY;
  const psKey = 'ps_'+today.toISOString().slice(0,10);
  if(!state[psKey]) state[psKey] = {};
  
  // Exact 3 items you requested for the sprint
  const sprintTasks = [
    'Problem Solving',
    'Revising Short Notes',
    'Test'
  ];

  let sprintHTML = `<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">Daily Tasks</div>`;
  
  sprintHTML += sprintTasks.map((task, i) => {
    const tid = 'st_'+i;
    const on = !!state[psKey][tid];
    return `<div class="check-item" onclick="togPS('${psKey}','${tid}',this)">
      <div class="chkbox ${on?'on':''}"><span style="color:#fff;font-size:14px">${on?'✓':''}</span></div>
      <span class="chk-label ${on?'struck':''}">${task}</span>
    </div>`;
  }).join('');

  sprintHTML += `
    <div style="font-size:11px;color:var(--muted);margin-top:16px;margin-bottom:8px;">Session Notes & Flagged Questions:</div>
    <textarea class="ps-note" style="margin-top:0;" placeholder="Log weak areas, flagged questions..." oninput="savePSNote('${psKey}',this.value)">${state[psKey+'_note']||''}</textarea>
  `;

  document.getElementById('psCard').innerHTML = sprintHTML;

  // Aptitude
  document.getElementById('aptiCard').innerHTML = `
    <div class="apt-header">
      <div class="apt-icon">📐</div>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--text)">Aptitude & Math Prep</div>
        <div style="font-size:11px;color:var(--green)">Currently Active</div>
      </div>
    </div>`;
}

window.togPS = function(k,tid,row){
  state[k][tid] = !state[k][tid]; save();
  const on = state[k][tid];
  row.querySelector('.chkbox').className = 'chkbox'+(on?' on':'');
  row.querySelector('.chkbox span').textContent = on?'✓':'';
  row.querySelector('.chk-label').className = 'chk-label'+(on?' struck':'');
};

window.savePSNote = function(k,v){ state[k+'_note'] = v; save(); };

window.showTab = function(name){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  const map = {today:0, timeline:1, tests:2, post:3};
  document.querySelectorAll('.nav-item')[map[name]].classList.add('active');
};

// Init
renderTop(); renderToday(); renderTimeline(); renderTests(); renderPost();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Registration failed', err));
  });
}
</script>
